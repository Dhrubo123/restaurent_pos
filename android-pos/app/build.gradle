plugins {
    id 'com.android.application'
}

android {
    namespace 'com.techbase.cliquepos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.techbase.cliquepos'
        minSdk 28
        targetSdk 35
        versionCode 12
        versionName '1.0.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'OldTargetApi'
    }
}
